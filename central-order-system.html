<!DOCTYPE html>
<html lang="en" class="h-full bg-[#f6f5f7] text-slate-800">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chandada | Shared Orders</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            panda: { pink: '#ff2b85', rose: '#ff5fa2', coral: '#ff8f6b', red: '#e31c5f', cream: '#fff7f9', gray: '#f5f5f7', ink: '#17171a' }
          },
          boxShadow: {
            soft: '0 18px 40px rgba(31, 41, 55, 0.08)',
            card: '0 12px 28px rgba(15, 23, 42, 0.06)',
            brand: '0 18px 30px rgba(255, 43, 133, 0.22)'
          }
        }
      }
    }
  </script>
  <style>
    .hidden-section { display: none !important; }
    .role-btn.active { background: linear-gradient(135deg, #ff2b85 0%, #ff5fa2 100%); color: white; }
  </style>
</head>
<body class="min-h-full text-slate-800 antialiased">
  <div id="toast-container" class="fixed right-5 top-5 z-50 flex flex-col gap-2"></div>

  <div class="app-shell">
    <header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/80 backdrop-blur-xl">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
        <div class="flex items-center gap-3">
          <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-[#ff2b85] via-[#ff7cb0] to-[#ffb36a] text-lg font-black text-white shadow-brand">C</div>
          <div>
            <div class="text-xl font-black tracking-tight text-slate-900">chandada</div>
            <div class="text-[10px] uppercase tracking-[0.22em] text-slate-500">shared order system</div>
          </div>
        </div>
        <div class="hidden items-center gap-2 rounded-full bg-[#fff3f8] p-1 md:flex">
          <button data-role="customer" class="role-btn active rounded-full px-4 py-2 text-sm font-semibold">Customer</button>
          <button data-role="owner" class="role-btn rounded-full px-4 py-2 text-sm font-semibold text-slate-700">Owner</button>
          <button data-role="rider" class="role-btn rounded-full px-4 py-2 text-sm font-semibold text-slate-700">Rider</button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      <section id="customer-view" class="role-view">
        <div class="rounded-[30px] bg-white p-6 shadow-soft">
          <h1 class="text-4xl font-black tracking-[-0.06em] text-slate-900">Shared customer app</h1>
          <p class="mt-3 text-slate-600">Orders are now saved to a central database so different devices can see the same order list.</p>
          <div class="mt-6 grid gap-6 lg:grid-cols-[1.2fr_0.8fr]">
            <div class="rounded-[28px] border border-slate-200 bg-slate-50 p-5">
              <div id="customer-restaurants" class="grid gap-4"></div>
            </div>
            <div class="rounded-[28px] border border-slate-200 bg-slate-50 p-5">
              <div id="restaurant-menu-panel"></div>
              <div class="mt-5 border-t border-slate-200 pt-4">
                <h3 class="text-xl font-black text-slate-900">Your order</h3>
                <div id="cart-items" class="mt-4 space-y-3"></div>
                <div class="mt-4 flex items-center justify-between text-sm text-slate-600"><span>Subtotal</span><span id="cart-subtotal">₱0</span></div>
                <div class="mt-2 flex items-center justify-between text-sm text-slate-600"><span>Delivery fee</span><span>₱35</span></div>
                <div class="mt-2 flex items-center justify-between text-lg font-black text-slate-900"><span>Total</span><span id="cart-total">₱0</span></div>
                <form id="checkout-form" class="mt-5 space-y-3">
                  <input id="checkout-name" placeholder="Customer name" class="w-full rounded-2xl border border-slate-200 bg-white px-3 py-2.5" />
                  <textarea id="checkout-address" rows="3" placeholder="Delivery address" class="w-full rounded-2xl border border-slate-200 bg-white px-3 py-2.5"></textarea>
                  <select id="checkout-payment" class="w-full rounded-2xl border border-slate-200 bg-white px-3 py-2.5">
                    <option>GCash</option>
                    <option>Maya</option>
                    <option>Card</option>
                    <option>Cash on Delivery</option>
                  </select>
                  <button type="submit" class="w-full rounded-2xl bg-[#ff2b85] px-4 py-3 text-sm font-bold text-white">Place order</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="owner-view" class="role-view hidden-section">
        <div class="grid gap-6 lg:grid-cols-[1.1fr_0.9fr]">
          <div class="rounded-[30px] bg-white p-6 shadow-soft">
            <p class="text-sm font-bold uppercase tracking-[0.22em] text-[#bf2d6d]">Business dashboard</p>
            <h2 class="mt-2 text-3xl font-black text-slate-900">Incoming requests</h2>
            <div id="owner-orders" class="mt-5 space-y-3"></div>
          </div>
          <div class="rounded-[30px] bg-white p-6 shadow-soft">
            <p class="text-sm font-bold uppercase tracking-[0.22em] text-[#bf2d6d]">Menu editor</p>
            <h2 class="mt-2 text-3xl font-black text-slate-900">Your menu</h2>
            <div id="menu-list" class="mt-5 space-y-3"></div>
          </div>
        </div>
      </section>

      <section id="rider-view" class="role-view hidden-section">
        <div class="rounded-[30px] bg-white p-6 shadow-soft">
          <p class="text-sm font-bold uppercase tracking-[0.2em] text-[#bf2d6d]">Rider panel</p>
          <h2 class="mt-2 text-3xl font-black text-slate-900">Delivery tasks</h2>
          <div id="rider-orders" class="mt-5 grid gap-4 md:grid-cols-2"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const appConfig = {
      url: 'https://YOUR_PROJECT_REF.supabase.co',
      anonKey: 'YOUR_SUPABASE_ANON_KEY',
      useCloudDb: false
    };

    const profileStorageKey = 'chandada_business_profiles';
    const orderStorageKey = 'chandada_orders';
    const cartStorageKey = 'chandada_cart';

    const defaultProfiles = [
      {
        id: 1,
        name: 'La Mesa Grill',
        owner: 'Maria Santos',
        city: 'Makati',
        type: 'Restaurant',
        description: 'Comfort food and grilled meals for busy city families.',
        photo: 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80',
        menu: [
          { id: 101, name: 'Chicken Inasal', category: 'Main', price: 180, description: 'Grilled chicken with vinegar marinade.', photo: 'https://images.unsplash.com/photo-1559847844-5315695dadae?auto=format&fit=crop&w=900&q=80' },
          { id: 102, name: 'Classic Halo-Halo', category: 'Dessert', price: 120, description: 'Cold dessert with beans, jelly, and ice cream.', photo: 'https://images.unsplash.com/photo-1551024601-bec402ecc7b4?auto=format&fit=crop&w=900&q=80' },
          { id: 103, name: 'Fresh Lemonade', category: 'Drink', price: 70, description: 'Refreshing citrus drink.', photo: 'https://images.unsplash.com/photo-1546173159-315724a2f15d?auto=format&fit=crop&w=900&q=80' }
        ]
      },
      {
        id: 2,
        name: 'Sunset Bakeshop',
        owner: 'Lito Ramos',
        city: 'Cebu',
        type: 'Bakery',
        description: 'Fresh pastries, breads, and special party desserts.',
        photo: 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1200&q=80',
        menu: [
          { id: 201, name: 'Cheese Ensaymada', category: 'Snack', price: 60, description: 'Soft brioche with butter and cheese.', photo: 'https://images.unsplash.com/photo-1509440159596-024ec1e4b239?auto=format&fit=crop&w=900&q=80' },
          { id: 202, name: 'Ube Cake Slice', category: 'Dessert', price: 140, description: 'Purple yam cake with cream finish.', photo: 'https://images.unsplash.com/photo-1551024601-bec402ecc7b4?auto=format&fit=crop&w=900&q=80' },
          { id: 203, name: 'Cappuccino', category: 'Drink', price: 110, description: 'Rich espresso and steamed milk.', photo: 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2e6f?auto=format&fit=crop&w=900&q=80' }
        ]
      }
    ];

    const defaultOrders = [
      {
        id: 1,
        businessId: 1,
        businessName: 'La Mesa Grill',
        customerName: 'Ana Reyes',
        customerAddress: '123 P. Cruz St., Makati',
        paymentMethod: 'GCash',
        total: 430,
        status: 'pending',
        rider: 'Rider 01',
        items: [{ id: 101, name: 'Chicken Inasal', quantity: 1, price: 180 }, { id: 103, name: 'Fresh Lemonade', quantity: 2, price: 70 }],
        createdAt: Date.now() - 1000 * 60 * 18
      }
    ];

    let profiles = [...defaultProfiles];
    let savedOrders = [...defaultOrders];
    let cart = JSON.parse(localStorage.getItem(cartStorageKey)) || [];
    let selectedBusinessId = profiles[0]?.id || null;

    const canUseSupabase = appConfig.url && appConfig.url !== 'https://YOUR_PROJECT_REF.supabase.co' && appConfig.anonKey && appConfig.anonKey !== 'YOUR_SUPABASE_ANON_KEY';
    const supabase = canUseSupabase ? window.supabase.createClient(appConfig.url, appConfig.anonKey) : null;

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-800 shadow-lg';
      toast.innerHTML = '<div class="flex items-center gap-2"><i class="fa-solid fa-circle-check text-panda-pink"></i><span>' + message + '</span></div>';
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2600);
    }

    function setMode(mode) {
      document.querySelectorAll('.role-btn').forEach(btn => {
        const active = btn.dataset.role === mode;
        btn.classList.toggle('active', active);
        btn.classList.toggle('text-slate-700', !active);
        btn.classList.toggle('text-white', active);
      });
      document.querySelectorAll('.role-view').forEach(view => {
        view.classList.toggle('hidden-section', view.id !== `${mode}-view`);
      });
    }

    function saveProfilesLocal() {
      localStorage.setItem(profileStorageKey, JSON.stringify(profiles));
    }

    function saveOrdersLocal() {
      localStorage.setItem(orderStorageKey, JSON.stringify(savedOrders));
    }

    function saveCartLocal() {
      localStorage.setItem(cartStorageKey, JSON.stringify(cart));
    }

    async function saveProfiles() {
      saveProfilesLocal();
      if (!supabase) return;
      const payload = profiles.map(profile => ({
        id: profile.id,
        name: profile.name,
        owner: profile.owner,
        city: profile.city,
        type: profile.type,
        description: profile.description,
        photo: profile.photo,
        menu: profile.menu || [],
      }));
      const { error } = await supabase.from('business_profiles').upsert(payload, { onConflict: 'id' });
      if (error) console.error('Supabase saveProfiles error:', error);
    }

    async function saveOrders() {
      saveOrdersLocal();
      if (!supabase) return;
      const payload = savedOrders.map(order => ({
        id: order.id,
        businessid: order.businessId,
        businessname: order.businessName,
        customername: order.customerName,
        customeraddress: order.customerAddress,
        paymentmethod: order.paymentMethod,
        total: Number(order.total),
        status: order.status,
        rider: order.rider,
        items: order.items || [],
        createdat: Number(order.createdAt || Date.now())
      }));
      const { error } = await supabase.from('orders').upsert(payload, { onConflict: 'id' });
      if (error) console.error('Supabase saveOrders error:', error);
    }

    async function loadCloudData() {
      if (!supabase) return;
      const { data: profileData } = await supabase.from('business_profiles').select('*');
      if (profileData && profileData.length) {
        profiles = profileData.map(p => ({ ...p, menu: p.menu || [] }));
        selectedBusinessId = profiles[0]?.id || null;
      }

      const { data: orderData } = await supabase.from('orders').select('*').order('createdat', { ascending: false });
      if (orderData && orderData.length) {
        savedOrders = orderData.map(order => ({
          id: order.id,
          businessId: order.businessid,
          businessName: order.businessname,
          customerName: order.customername,
          customerAddress: order.customeraddress,
          paymentMethod: order.paymentmethod,
          total: Number(order.total),
          status: order.status,
          rider: order.rider,
          items: order.items || [],
          createdAt: Number(order.createdat)
        }));
      }
    }

    function renderCart() {
      const cartItemsEl = document.getElementById('cart-items');
      const subtotalEl = document.getElementById('cart-subtotal');
      const totalEl = document.getElementById('cart-total');

      if (!cart.length) {
        cartItemsEl.innerHTML = '<div class="rounded-2xl border border-dashed border-slate-200 bg-slate-50 p-5 text-center text-sm text-slate-500">Your cart is empty.</div>';
        subtotalEl.textContent = '₱0';
        totalEl.textContent = '₱0';
        return;
      }

      cartItemsEl.innerHTML = cart.map(item => `
        <div class="rounded-2xl border border-slate-200 bg-white p-3">
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="font-bold text-slate-900">${item.name}</div>
              <div class="text-xs text-slate-500">₱${item.price} each</div>
            </div>
            <div class="flex items-center gap-2">
              <button class="decrease-item rounded-full border border-slate-200 bg-white px-2 py-1 text-xs font-bold" data-item-id="${item.id}">-</button>
              <span class="text-sm font-bold text-slate-900">${item.quantity}</span>
              <button class="increase-item rounded-full border border-slate-200 bg-white px-2 py-1 text-xs font-bold" data-item-id="${item.id}">+</button>
            </div>
          </div>
        </div>
      `).join('');

      const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      subtotalEl.textContent = `₱${subtotal.toLocaleString()}`;
      totalEl.textContent = `₱${(subtotal + 35).toLocaleString()}`;

      document.querySelectorAll('.increase-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const itemId = Number(btn.dataset.itemId);
          const match = cart.find(entry => entry.id === itemId);
          if (match) match.quantity += 1;
          localStorage.setItem(cartStorageKey, JSON.stringify(cart));
          renderCart();
        });
      });

      document.querySelectorAll('.decrease-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const itemId = Number(btn.dataset.itemId);
          const index = cart.findIndex(entry => entry.id === itemId);
          if (index === -1) return;
          if (cart[index].quantity > 1) cart[index].quantity -= 1;
          else cart.splice(index, 1);
          localStorage.setItem(cartStorageKey, JSON.stringify(cart));
          renderCart();
        });
      });
    }

    function addToCart(menuItem, restaurantId) {
      const existing = cart.find(item => item.id === menuItem.id && item.restaurantId === restaurantId);
      if (existing) existing.quantity += 1;
      else cart.push({ id: menuItem.id, restaurantId, name: menuItem.name, price: Number(menuItem.price), quantity: 1 });
      localStorage.setItem(cartStorageKey, JSON.stringify(cart));
      renderCart();
      showToast(`${menuItem.name} added to cart.`);
    }

    function renderCustomerRestaurants() {
      const container = document.getElementById('customer-restaurants');
      container.innerHTML = profiles.map(profile => `
        <article class="rounded-[28px] border border-slate-200 bg-white p-4 shadow-sm">
          <img src="${profile.photo}" alt="${profile.name}" class="h-32 w-full rounded-[20px] object-cover" />
          <div class="mt-4 flex items-center justify-between gap-3">
            <div>
              <h3 class="text-xl font-black text-slate-900">${profile.name}</h3>
              <p class="text-sm text-slate-500">${profile.type} • ${profile.city}</p>
            </div>
            <div class="rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-bold text-emerald-700">4.8 ★</div>
          </div>
          <p class="mt-3 text-sm text-slate-600">${profile.description}</p>
          <button class="mt-4 w-full rounded-2xl bg-[#fff1f7] px-3 py-2 text-sm font-bold text-[#bf2d6d] open-restaurant" data-restaurant-id="${profile.id}">View menu</button>
        </article>
      `).join('');

      document.querySelectorAll('.open-restaurant').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedBusinessId = Number(btn.dataset.restaurantId);
          renderRestaurantMenu();
          showToast('Loaded restaurant menu.');
        });
      });
    }

    function renderRestaurantMenu() {
      const panel = document.getElementById('restaurant-menu-panel');
      const business = profiles.find(item => item.id === selectedBusinessId) || profiles[0];
      panel.innerHTML = `
        <div class="flex items-start justify-between gap-4">
          <div>
            <p class="text-sm font-bold uppercase tracking-[0.2em] text-[#bf2d6d]">Selected store</p>
            <h3 class="mt-2 text-3xl font-black text-slate-900">${business.name}</h3>
            <p class="mt-1 text-sm text-slate-500">${business.type} • ${business.city}</p>
          </div>
          <div class="rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-bold text-emerald-700">4.8 ★</div>
        </div>
        <div class="mt-4 overflow-hidden rounded-[22px] border border-slate-200 bg-white">
          <img src="${business.photo}" alt="${business.name}" class="h-48 w-full object-cover" />
        </div>
        <div class="mt-5 grid gap-3">
          ${(business.menu || []).map(item => `
            <div class="rounded-[22px] border border-slate-200 bg-white p-3">
              <div class="flex items-start gap-3">
                <img src="${item.photo}" alt="${item.name}" class="h-16 w-16 rounded-2xl object-cover" />
                <div class="flex-1">
                  <div class="flex items-start justify-between gap-3">
                    <div>
                      <div class="flex items-center gap-2">
                        <h4 class="text-lg font-black text-slate-900">${item.name}</h4>
                        <span class="rounded-full bg-[#fff1f7] px-2 py-1 text-[10px] font-bold uppercase text-[#bf2d6d]">${item.category}</span>
                      </div>
                      <p class="mt-1 text-sm text-slate-500">${item.description}</p>
                    </div>
                    <div class="text-right">
                      <div class="text-base font-black text-slate-900">₱${Number(item.price).toLocaleString()}</div>
                    </div>
                  </div>
                  <div class="mt-3 flex justify-end">
                    <button class="add-item rounded-2xl bg-[#ff2b85] px-3 py-2 text-sm font-bold text-white" data-item-id="${item.id}" data-item-name="${item.name}" data-item-price="${item.price}">Add</button>
                  </div>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      document.querySelectorAll('.add-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = business.menu.find(entry => entry.id === Number(btn.dataset.itemId));
          if (!item) return;
          addToCart(item, business.id);
        });
      });
    }

    function renderOwnerOrders() {
      const container = document.getElementById('owner-orders');
      const owned = savedOrders.filter(order => profiles.some(profile => profile.id === order.businessId));
      if (!owned.length) {
        container.innerHTML = '<div class="rounded-[24px] border border-dashed border-slate-200 bg-slate-50 p-5 text-center text-sm text-slate-500">No shared orders yet.</div>';
        return;
      }

      container.innerHTML = owned.map(order => `
        <div class="rounded-[22px] border border-slate-200 bg-white p-4">
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="text-sm font-bold uppercase tracking-[0.12em] text-slate-400">${order.businessName}</div>
              <h3 class="mt-1 text-lg font-black text-slate-900">${order.customerName}</h3>
            </div>
            <span class="rounded-full bg-[#fff1f7] px-2 py-1 text-[10px] font-bold uppercase text-[#bf2d6d]">${order.status}</span>
          </div>
          <p class="mt-2 text-sm text-slate-500">${order.customerAddress}</p>
          <div class="mt-3 text-sm text-slate-700">
            ${order.items.map(item => `<div class="flex justify-between py-1"><span>${item.name} x${item.quantity}</span><span>₱${(item.price * item.quantity).toLocaleString()}</span></div>`).join('')}
          </div>
          <div class="mt-3 flex items-center justify-between border-t border-slate-200 pt-3 text-sm">
            <span class="font-bold text-slate-900">Total</span>
            <span class="font-black text-slate-900">₱${Number(order.total).toLocaleString()}</span>
          </div>
          <div class="mt-3 flex gap-2">
            <button class="owner-status-btn rounded-xl bg-[#ff2b85] px-3 py-2 text-xs font-bold text-white" data-order-id="${order.id}" data-status="accepted">Accept</button>
            <button class="owner-status-btn rounded-xl border border-slate-200 bg-slate-100 px-3 py-2 text-xs font-bold text-slate-700" data-order-id="${order.id}" data-status="on-the-way">On the way</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.owner-status-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const order = savedOrders.find(item => item.id === Number(btn.dataset.orderId));
          if (!order) return;
          order.status = btn.dataset.status;
          await saveOrders();
          renderOwnerOrders();
          renderRiderOrders();
          showToast(`Order marked as ${btn.dataset.status}.`);
        });
      });
    }

    function renderRiderOrders() {
      const container = document.getElementById('rider-orders');
      const active = savedOrders.filter(order => ['pending', 'accepted', 'on-the-way'].includes(order.status));
      if (!active.length) {
        container.innerHTML = '<div class="rounded-[24px] border border-dashed border-slate-200 bg-slate-50 p-5 text-center text-sm text-slate-500">No delivery tasks right now.</div>';
        return;
      }

      container.innerHTML = active.map(order => `
        <div class="rounded-[24px] border border-slate-200 bg-white p-4">
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400">${order.businessName}</div>
              <h3 class="mt-1 text-xl font-black text-slate-900">${order.customerName}</h3>
            </div>
            <span class="rounded-full bg-[#fff1f7] px-2 py-1 text-[10px] font-bold uppercase text-[#bf2d6d]">${order.status}</span>
          </div>
          <p class="mt-3 text-sm text-slate-500">${order.customerAddress}</p>
          <div class="mt-3 text-sm text-slate-700">
            ${order.items.map(item => `<div class="flex justify-between py-1"><span>${item.name} x${item.quantity}</span><span>₱${(item.price * item.quantity).toLocaleString()}</span></div>`).join('')}
          </div>
          <div class="mt-3 flex gap-2">
            <button class="rider-status-btn rounded-xl bg-[#ff2b85] px-3 py-2 text-xs font-bold text-white" data-order-id="${order.id}" data-status="accepted">Accept</button>
            <button class="rider-status-btn rounded-xl border border-slate-200 bg-slate-100 px-3 py-2 text-xs font-bold text-slate-700" data-order-id="${order.id}" data-status="on-the-way">On the way</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.rider-status-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const order = savedOrders.find(item => item.id === Number(btn.dataset.orderId));
          if (!order) return;
          order.status = btn.dataset.status;
          await saveOrders();
          renderOwnerOrders();
          renderRiderOrders();
          showToast(`Delivery status updated to ${btn.dataset.status}.`);
        });
      });
    }

    function renderMenuList() {
      const selectedBusiness = profiles.find(item => item.id === selectedBusinessId) || profiles[0];
      const list = document.getElementById('menu-list');
      if (!selectedBusiness) {
        list.innerHTML = '<div class="rounded-[24px] border border-dashed border-slate-200 bg-white p-6 text-center text-slate-500">No business selected.</div>';
        return;
      }
      list.innerHTML = (selectedBusiness.menu || []).map(item => `
        <div class="rounded-[24px] border border-slate-200 bg-white p-4">
          <div class="flex items-start gap-3">
            <img src="${item.photo}" alt="${item.name}" class="h-16 w-16 rounded-2xl object-cover" />
            <div class="flex-1">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <h3 class="text-lg font-black text-slate-900">${item.name}</h3>
                  <span class="rounded-full bg-[#fff1f7] px-2 py-1 text-[10px] font-bold uppercase text-[#bf2d6d]">${item.category}</span>
                </div>
                <div class="text-right">
                  <div class="text-base font-black text-slate-900">₱${Number(item.price).toLocaleString()}</div>
                </div>
              </div>
              <p class="mt-2 text-sm text-slate-500">${item.description}</p>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.role));
    });

    document.getElementById('checkout-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!cart.length) {
        showToast('Your cart is empty.');
        return;
      }

      const name = document.getElementById('checkout-name').value.trim();
      const address = document.getElementById('checkout-address').value.trim();
      const payment = document.getElementById('checkout-payment').value;
      if (!name || !address) {
        showToast('Please add a name and delivery address.');
        return;
      }

      const business = profiles.find(item => item.id === selectedBusinessId) || profiles[0];
      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0) + 35;
      const order = {
        id: Date.now(),
        businessId: business.id,
        businessName: business.name,
        customerName: name,
        customerAddress: address,
        paymentMethod: payment,
        total,
        status: 'pending',
        rider: 'Rider 01',
        items: cart.map(item => ({ id: item.id, name: item.name, quantity: item.quantity, price: item.price })),
        createdAt: Date.now()
      };

      savedOrders.unshift(order);
      await saveOrders();
      cart = [];
      localStorage.setItem(cartStorageKey, JSON.stringify(cart));
      renderCart();
      renderOwnerOrders();
      renderRiderOrders();
      event.target.reset();
      showToast('Order placed successfully!');
    });

    async function initializeApp() {
      await loadCloudData();
      renderCustomerRestaurants();
      renderRestaurantMenu();
      renderCart();
      renderOwnerOrders();
      renderRiderOrders();
      renderMenuList();
      setMode('customer');

      if (!supabase) {
        showToast('Database not configured yet. Add your Supabase credentials to make this multi-user.');
      }
    }

    initializeApp();
  </script>
</body>
</html>
