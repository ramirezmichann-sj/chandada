<!DOCTYPE html>
<html lang="en" class="h-full bg-[#f6f5f7] text-slate-800">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fusion Nook | Live Orders</title>
  <meta name="description" content="Fusion Nook live order tracker with preparation timer and delivery status." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fusion: {
              pink: '#ff2b85',
              rose: '#ff5fa2',
              coral: '#ff8f6b',
              red: '#e31c5f',
              cream: '#fff7f9',
              gray: '#f5f5f7',
              ink: '#17171a'
            }
          },
          boxShadow: {
            soft: '0 18px 40px rgba(31, 41, 55, 0.08)',
            card: '0 12px 28px rgba(15, 23, 42, 0.06)',
            brand: '0 18px 30px rgba(255, 43, 133, 0.22)'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #fffafc 0%, #f7f6f9 100%);
    }
    .fusion-btn {
      background: linear-gradient(135deg, #ff2b85 0%, #ff5fa2 100%);
      color: white;
      box-shadow: 0 16px 28px rgba(255, 43, 133, 0.2);
    }
    .soft-card {
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(148,163,184,0.18);
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.05);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      padding: 0.4rem 0.75rem;
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .timer-box {
      border: 1px solid rgba(148,163,184,0.15);
      background: linear-gradient(180deg, #fff7fb 0%, #fff 100%);
    }
  </style>
</head>
<body class="min-h-full antialiased">
  <div id="toast-container" class="fixed right-5 top-5 z-50 flex flex-col gap-2"></div>

  <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <header class="soft-card rounded-[30px] p-4 sm:p-6">
      <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-3">
          <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-[#ff2b85] via-[#ff7cb0] to-[#ffb36a] text-xl font-black text-white shadow-brand">F</div>
          <div>
            <div class="text-2xl font-black tracking-tight text-slate-900">Fusion Nook</div>
            <div class="text-[10px] uppercase tracking-[0.22em] text-slate-500">live order tracker</div>
          </div>
        </div>

        <div class="flex flex-wrap gap-3 text-sm font-semibold text-slate-600">
          <div class="rounded-full bg-[#fff1f7] px-3 py-2 text-[#bf2d6d]">Pending: <span id="pending-count">0</span></div>
          <div class="rounded-full bg-[#ecfeff] px-3 py-2 text-[#0f766e]">Preparing: <span id="accepted-count">0</span></div>
          <div class="rounded-full bg-[#ecfdf5] px-3 py-2 text-[#15803d]">Finished: <span id="finished-count">0</span></div>
          <div class="rounded-full bg-[#eef2ff] px-3 py-2 text-[#4f46e5]">In Delivery: <span id="delivery-count">0</span></div>
        </div>
      </div>
    </header>

    <main class="mt-8 space-y-6">
      <section class="soft-card rounded-[30px] p-5 sm:p-6">
        <div class="flex items-center justify-between gap-4">
          <div>
            <p class="text-sm font-bold uppercase tracking-[0.2em] text-[#bf2d6d]">Operations</p>
            <h2 class="mt-2 text-3xl font-black tracking-[-0.05em] text-slate-900">Ongoing orders</h2>
          </div>
          <button id="add-demo-order" class="fusion-btn rounded-2xl px-4 py-2.5 text-sm font-bold">Add demo order</button>
        </div>

        <div id="orders-list" class="mt-6 grid gap-4"></div>
      </section>
    </main>
  </div>

  <script>
    const orderStorageKey = 'fusion_nook_live_orders';

    let orders = JSON.parse(localStorage.getItem(orderStorageKey)) || [
      {
        id: 1,
        customerName: 'Maria Santos',
        customerAddress: '123 P. Cruz St., Makati',
        paymentMethod: 'GCash',
        total: 430,
        status: 'accepted',
        acceptedAt: Date.now() - 1000 * 60 * 4,
        finishedAt: Date.now() - 1000 * 60 * 1,
        deliveryStartedAt: Date.now() - 1000 * 30,
        items: [
          { name: 'Fusion Burger', quantity: 1, price: 180 },
          { name: 'Iced Coffee', quantity: 2, price: 95 }
        ]
      },
      {
        id: 2,
        customerName: 'Carl Dela Cruz',
        customerAddress: '88 M. Ponce St., Makati',
        paymentMethod: 'Maya',
        total: 310,
        status: 'finished',
        acceptedAt: Date.now() - 1000 * 60 * 10,
        finishedAt: Date.now() - 1000 * 60 * 2,
        deliveryStartedAt: Date.now() - 1000 * 60 * 0.5,
        items: [
          { name: 'Chicken Alfredo', quantity: 1, price: 220 },
          { name: 'Mango Cheesecake', quantity: 1, price: 140 }
        ]
      },
      {
        id: 3,
        customerName: 'Ria Gomez',
        customerAddress: '40 Lapu-Lapu Ave., Makati',
        paymentMethod: 'Cash on Delivery',
        total: 250,
        status: 'in-delivery',
        acceptedAt: Date.now() - 1000 * 60 * 12,
        finishedAt: Date.now() - 1000 * 60 * 5,
        deliveryStartedAt: Date.now() - 1000 * 60 * 2,
        items: [
          { name: 'Fusion Bowl', quantity: 1, price: 170 },
          { name: 'Iced Coffee', quantity: 1, price: 95 }
        ]
      }
    ];

    function saveOrders() {
      localStorage.setItem(orderStorageKey, JSON.stringify(orders));
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-800 shadow-lg';
      toast.innerHTML = '<div class="flex items-center gap-2"><i class="fa-solid fa-circle-check text-[#ff2b85]"></i><span>' + message + '</span></div>';
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2200);
    }

    function formatDuration(ms) {
      const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function getStatusMeta(status) {
      const map = {
        pending: { label: 'Pending', className: 'bg-yellow-100 text-yellow-700' },
        accepted: { label: 'Preparing', className: 'bg-cyan-100 text-cyan-700' },
        finished: { label: 'Finished', className: 'bg-emerald-100 text-emerald-700' },
        'in-delivery': { label: 'In Delivery', className: 'bg-indigo-100 text-indigo-700' }
      };
      return map[status] || map.pending;
    }

    function getTimerText(order) {
      const now = Date.now();

      if (order.status === 'pending') return 'Waiting for acceptance';

      if (order.status === 'accepted') {
        const acceptedAt = order.acceptedAt || order.createdAt || now;
        const prepLimit = 1000 * 60 * 12;
        const remaining = Math.max(0, prepLimit - (now - acceptedAt));
        return `Prep: ${formatDuration(remaining)}`;
      }

      if (order.status === 'finished') {
        const finishedAt = order.finishedAt || order.acceptedAt || now;
        const readyLimit = 1000 * 60 * 6;
        const remaining = Math.max(0, readyLimit - (now - finishedAt));
        return `Ready in: ${formatDuration(remaining)}`;
      }

      if (order.status === 'in-delivery') {
        const deliveryStartedAt = order.deliveryStartedAt || order.finishedAt || now;
        const etaLimit = 1000 * 60 * 15;
        const remaining = Math.max(0, etaLimit - (now - deliveryStartedAt));
        return `ETA: ${formatDuration(remaining)}`;
      }

      return 'No timer';
    }

    function updateStatusCounts() {
      document.getElementById('pending-count').textContent = orders.filter(o => o.status === 'pending').length;
      document.getElementById('accepted-count').textContent = orders.filter(o => o.status === 'accepted').length;
      document.getElementById('finished-count').textContent = orders.filter(o => o.status === 'finished').length;
      document.getElementById('delivery-count').textContent = orders.filter(o => o.status === 'in-delivery').length;
    }

    function renderOrders() {
      const list = document.getElementById('orders-list');

      if (!orders.length) {
        list.innerHTML = '<div class="rounded-[24px] border border-dashed border-slate-200 bg-slate-50 p-8 text-center text-slate-500">No orders available.</div>';
        updateStatusCounts();
        return;
      }

      list.innerHTML = orders.map(order => {
        const meta = getStatusMeta(order.status);
        const timerText = getTimerText(order);
        return `
          <article class="soft-card rounded-[28px] p-4 sm:p-5">
            <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
              <div class="space-y-2">
                <div class="flex items-center gap-3">
                  <span class="status-pill ${meta.className}">${meta.label}</span>
                  <span class="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">Order #${order.id}</span>
                </div>
                <h3 class="text-2xl font-black text-slate-900">${order.customerName}</h3>
                <p class="text-sm text-slate-500">${order.customerAddress}</p>
              </div>

              <div class="timer-box w-full max-w-[210px] rounded-[20px] p-3 text-left">
                <div class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500">Live timer</div>
                <div class="mt-1 text-2xl font-black text-slate-900">${timerText}</div>
              </div>
            </div>

            <div class="mt-5 grid gap-3 md:grid-cols-[1.2fr_0.8fr]">
              <div class="rounded-[22px] border border-slate-200 bg-slate-50 p-3">
                <div class="text-[10px] font-bold uppercase tracking-[0.18em] text-slate-500">Items</div>
                <div class="mt-3 space-y-2 text-sm text-slate-700">
                  ${order.items.map(item => `
                    <div class="flex items-center justify-between gap-3">
                      <span>${item.name} x${item.quantity}</span>
                      <span>₱${(item.price * item.quantity).toLocaleString()}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="rounded-[22px] border border-slate-200 bg-slate-50 p-3">
                <div class="text-[10px] font-bold uppercase tracking-[0.18em] text-slate-500">Payment</div>
                <div class="mt-2 text-lg font-black text-slate-900">₱${Number(order.total).toLocaleString()}</div>
                <div class="mt-2 text-sm text-slate-600">${order.paymentMethod}</div>
                <div class="mt-4 flex flex-wrap gap-2">
                  <button class="status-btn rounded-xl bg-[#ff2b85] px-3 py-2 text-[10px] font-bold uppercase tracking-[0.12em] text-white" data-order-id="${order.id}" data-status="accepted">Accept</button>
                  <button class="status-btn rounded-xl bg-emerald-500 px-3 py-2 text-[10px] font-bold uppercase tracking-[0.12em] text-white" data-order-id="${order.id}" data-status="finished">Finished</button>
                  <button class="status-btn rounded-xl bg-indigo-500 px-3 py-2 text-[10px] font-bold uppercase tracking-[0.12em] text-white" data-order-id="${order.id}" data-status="in-delivery">In delivery</button>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      document.querySelectorAll('.status-btn').forEach(button => {
        button.addEventListener('click', () => {
          const id = Number(button.dataset.orderId);
          const status = button.dataset.status;
          const targetOrder = orders.find(order => order.id === id);
          if (!targetOrder) return;

          targetOrder.status = status;
          if (status === 'accepted' && !targetOrder.acceptedAt) targetOrder.acceptedAt = Date.now();
          if (status === 'finished' && !targetOrder.finishedAt) targetOrder.finishedAt = Date.now();
          if (status === 'in-delivery' && !targetOrder.deliveryStartedAt) targetOrder.deliveryStartedAt = Date.now();

          saveOrders();
          renderOrders();
          updateStatusCounts();
          showToast(`Order ${id} set to ${getStatusMeta(status).label}.`);
        });
      });

      updateStatusCounts();
    }

    function addDemoOrder() {
      const nextId = orders.length ? Math.max(...orders.map(o => o.id)) + 1 : 1;
      orders.unshift({
        id: nextId,
        customerName: `Customer ${nextId}`,
        customerAddress: `Block ${nextId}, New City`,
        paymentMethod: 'GCash',
        total: 290 + nextId * 15,
        status: 'pending',
        acceptedAt: null,
        finishedAt: null,
        deliveryStartedAt: null,
        items: [
          { name: 'Fusion Burger', quantity: 1, price: 180 },
          { name: 'Iced Coffee', quantity: 1, price: 95 }
        ]
      });
      saveOrders();
      renderOrders();
      showToast('Demo order added.');
    }

    document.getElementById('add-demo-order').addEventListener('click', addDemoOrder);

    renderOrders();
    setInterval(() => {
      renderOrders();
    }, 1000);
  </script>
</body>
</html>
